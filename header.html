<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Online Grocery Store - Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif; }

    body { padding-top: 108px; min-height: 220vh; background: #F1F8E9; }

    /* ===== LIGHT GROCERY NAVBAR — MATCHING FOOTER ===== */
    .navbar {
      position: fixed; top: 14px; left: 14px; right: 14px;
      z-index: 1000; border-radius: 18px;
      background: #ffffff;
      border: 1px solid #E8F5E9;
      box-shadow: 0 6px 22px rgba(46, 125, 50, 0.10);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .navbar.scrolled {
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(46, 125, 50, 0.18);
    }
    .navbar::after {
      content: ''; position: absolute;
      left: 22px; right: 22px; bottom: 0;
      height: 2px; border-radius: 2px; background: #FF9800;
      pointer-events: none;
    }

    .nav-container {
      max-width: 1400px; margin: 0 auto; padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
      height: 76px; gap: 18px; width: 100%;
    }

    /* LOGO */
    .logo-section {
      display: flex; align-items: center; text-decoration: none; cursor: pointer;
      flex-shrink: 0; transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .logo-section:hover { opacity: 0.9; transform: scale(1.03); }
    .logo-img { height: 62px; width: auto; object-fit: contain; display: block; }

    /* NAV LINKS — dark text, green icons, orange hover */
    .nav-links {
      display: flex; align-items: center; gap: 22px; flex: 1;
      justify-content: center; flex-wrap: nowrap;
    }
    .nav-link {
      background: none; border: none; padding: 0 0 3px 0;
      font-size: 0.88rem; font-weight: 600; color: #1B3A1F;
      cursor: pointer; transition: all 0.25s ease;
      font-family: inherit; white-space: nowrap; letter-spacing: 0.3px;
      display: inline-flex; align-items: center; gap: 7px;
      border-bottom: 2px solid transparent; text-decoration: none;
    }
    .nav-link i { color: #2E7D32; font-size: 0.88rem; transition: 0.2s; }
    .nav-link:hover { color: #FF9800; border-bottom-color: #FF9800; transform: translateY(-2px); }
    .nav-link:hover i { color: #FF9800; }

    /* RIGHT ACTIONS */
    .right-actions {
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }

    /* Signup — outlined green */
    .action-link {
      background: transparent;
      border: 1.5px solid #2E7D32;
      padding: 0.42rem 1.15rem;
      border-radius: 60px;
      font-weight: 600; font-size: 0.85rem;
      color: #2E7D32; cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: inline-flex; align-items: center; gap: 8px;
      white-space: nowrap; text-decoration: none;
    }
    .action-link i { color: #2E7D32; font-size: 0.85rem; }

    /* Login — orange CTA */
    .action-link.login-link {
      background: #FF9800; border: 1.5px solid #FF9800;
      color: #FFFFFF; font-weight: 700;
      box-shadow: 0 4px 14px rgba(255, 152, 0, 0.30);
    }
    .action-link.login-link i { color: #FFFFFF; }

    .action-link:hover {
      background: #2E7D32; border-color: #2E7D32;
      color: #fff; transform: scale(1.04);
    }
    .action-link:hover i { color: #fff; }

    .action-link.login-link:hover {
      background: #FB8C00; border-color: #FB8C00;
      color: #fff; transform: scale(1.04);
    }
    .action-link.login-link:hover i { color: #fff; }

    /* HAMBURGER — green bars on light bg */
    .hamburger {
      display: none; flex-direction: column; cursor: pointer;
      gap: 5px; padding: 6px; background: transparent;
      border: none; z-index: 1001;
    }
    .hamburger span {
      width: 24px; height: 2.2px; background: #2E7D32;
      border-radius: 4px; transition: all 0.3s ease;
    }
    .hamburger:hover span { background: #FF9800; }
    .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); background: #FF9800; }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); background: #FF9800; }

    /* MOBILE MENU — soft mint like footer */
    .mobile-menu {
      position: fixed; top: 0; left: -100%;
      width: 100%; height: 100vh;
      background: #F1F8E9; z-index: 999;
      transition: left 0.4s ease-in-out;
      overflow-y: auto; padding-top: 100px;
    }
    .mobile-menu.active { left: 0; }

    .mobile-nav-links {
      display: flex; flex-direction: column;
      padding: 16px 28px; gap: 8px;
    }
    .mobile-nav-link {
      background: none; border: none; padding: 12px 0;
      font-size: 1.05rem; font-weight: 600; color: #1B3A1F;
      cursor: pointer; transition: all 0.25s ease;
      text-align: left; font-family: inherit;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid #E8F5E9;
      width: 100%; text-decoration: none;
    }
    .mobile-nav-link i { width: 28px; color: #2E7D32; font-size: 1.05rem; transition: 0.2s; }
    .mobile-nav-link:hover { color: #FF9800; transform: translateX(8px); }
    .mobile-nav-link:hover i { color: #FF9800; }

    .mobile-actions {
      display: flex; flex-direction: column; gap: 12px;
      padding: 20px 28px; margin-top: 16px;
      border-top: 1px solid #E8F5E9;
    }
    .mobile-action-link {
      background: transparent; border: 1.5px solid #2E7D32;
      padding: 12px 0; border-radius: 60px;
      font-size: 1rem; font-weight: 600; color: #2E7D32;
      cursor: pointer; transition: all 0.25s ease;
      font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; width: 100%; text-decoration: none;
    }
    .mobile-action-link i { color: #2E7D32; font-size: 1rem; }
    .mobile-action-link:hover { background: #2E7D32; border-color: #2E7D32; color: #fff; }
    .mobile-action-link:hover i { color: #fff; }

    .mobile-action-link.login-mobile {
      background: #FF9800; border-color: #FF9800;
      color: #FFFFFF; font-weight: 700;
    }
    .mobile-action-link.login-mobile i { color: #FFFFFF; }
    .mobile-action-link.login-mobile:hover {
      background: #FB8C00; border-color: #FB8C00; color: #fff;
    }
    .mobile-action-link.login-mobile:hover i { color: #fff; }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .nav-links { gap: 14px; }
      .nav-link { font-size: 0.8rem; }
      .nav-link i { font-size: 0.8rem; }
      .logo-img { height: 56px; }
    }
    @media (max-width: 900px) {
      .nav-link span { display: none; }
      .nav-link { font-size: 1.05rem; gap: 0; }
      .nav-link i { font-size: 1.05rem; }
    }
    @media (max-width: 768px) {
      body { padding-top: 96px; }
      .navbar { top: 12px; left: 12px; right: 12px; border-radius: 16px; }
      .nav-container { padding: 0 16px; height: 68px; }
      .nav-links { display: none; }
      .right-actions { display: none; }
      .hamburger { display: flex; }
      .logo-img { height: 50px; }
      .mobile-menu { padding-top: 92px; }
    }
    @media (max-width: 480px) {
      body { padding-top: 88px; }
      .navbar { top: 10px; left: 10px; right: 10px; border-radius: 14px; }
      .nav-container { height: 62px; padding: 0 14px; }
      .logo-img { height: 46px; }
      .mobile-nav-link { font-size: 0.98rem; padding: 11px 0; }
      .mobile-nav-link i { font-size: 0.98rem; width: 26px; }
      .mobile-action-link { font-size: 0.95rem; padding: 11px 0; }
      .mobile-menu { padding-top: 84px; }
    }
  </style>
</head>
<body>

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">

      <!-- LOGO -->
      <a href="index.html" class="logo-section">
        <img src="logoo3.webp" alt="Online Grocery Store Logo" class="logo-img" />
      </a>

      <!-- 5 CENTER NAV LINKS — matching footer -->
      <div class="nav-links">
        <a href="index.html" class="nav-link"><i class="fas fa-house"></i> <span>Home</span></a>
        <a href="shop.html" class="nav-link"><i class="fas fa-basket-shopping"></i> <span>Shop Groceries</span></a>
        <a href="categories.html" class="nav-link"><i class="fas fa-layer-group"></i> <span>Categories</span></a>
        <a href="offers.html" class="nav-link"><i class="fas fa-tags"></i> <span>Offers &amp; Deals</span></a>
        <a href="delivery.html" class="nav-link"><i class="fas fa-truck-fast"></i> <span>Delivery Info</span></a>
      </div>

      <!-- RIGHT: Signup + Login -->
      <div class="right-actions">
        <a href="signup.html" class="action-link">
          <i class="fas fa-user-plus"></i> Signup
        </a>
        <a href="login.html" class="action-link login-link">
          <i class="fas fa-right-to-bracket"></i> Login
        </a>
      </div>

      <!-- HAMBURGER -->
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

    </div>
  </nav>

  <!-- ====== MOBILE MENU ====== -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link"><i class="fas fa-house"></i> Home</a>
      <a href="shop.html" class="mobile-nav-link"><i class="fas fa-basket-shopping"></i> Shop Groceries</a>
      <a href="categories.html" class="mobile-nav-link"><i class="fas fa-layer-group"></i> Categories</a>
      <a href="offers.html" class="mobile-nav-link"><i class="fas fa-tags"></i> Offers &amp; Deals</a>
      <a href="delivery.html" class="mobile-nav-link"><i class="fas fa-truck-fast"></i> Delivery Info</a>
    </div>

    <div class="mobile-actions">
      <a href="signup.html" class="mobile-action-link">
        <i class="fas fa-user-plus"></i> Signup
      </a>
      <a href="login.html" class="mobile-action-link login-mobile">
        <i class="fas fa-right-to-bracket"></i> Login
      </a>
    </div>
  </div>

  <!-- ====== JAVASCRIPT ====== -->
  <script>
    (function() {
      const navbar = document.getElementById('navbar');
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const mobileMenu = document.getElementById('mobileMenu');

      function handleScroll() { navbar.classList.toggle('scrolled', window.scrollY > 30); }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();

      function toggleMobileMenu() {
        hamburgerBtn.classList.toggle('active');
        mobileMenu.classList.toggle('active');
        document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
      }
      function closeMobileMenu() {
        hamburgerBtn.classList.remove('active');
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      }

      hamburgerBtn.addEventListener('click', toggleMobileMenu);
      document.querySelectorAll('.mobile-nav-link, .mobile-action-link').forEach(link => {
        link.addEventListener('click', closeMobileMenu);
      });
      document.addEventListener('click', function(e) {
        if (mobileMenu.classList.contains('active')) {
          if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) closeMobileMenu();
        }
      });
      window.addEventListener('resize', () => { if (window.innerWidth > 768) closeMobileMenu(); });
      window.addEventListener('keydown', e => { if (e.key === 'Escape') closeMobileMenu(); });
    })();
  </script>

</body>
</html>
